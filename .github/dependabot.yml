version: 2

updates:
  # Python dependencies (uv)
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
      include: scope
    groups:
      pydantic:
        patterns:
          - "pydantic"
          - "pydantic-*"
      dev:
        patterns:
          - "coverage"
          - "ruff"
          - "pytest*"
    target-branch: "dev"
    
  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: scope
    groups:
      github-actions-dependencies:
        patterns:
          - "*"
    target-branch: "dev"