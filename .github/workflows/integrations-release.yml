name: Integrations Release

# Release one integration: push a tag named `<package>-vX.Y.Z`, e.g. `bedrock-fastapi-v0.1.0`.
# Core releases use plain `vX.Y.Z` tags and `release.yml`.
on:
  push:
    tags:
      - "bedrock-*-v*.*.*"

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      package: ${{ steps.tag.outputs.package }}
      version: ${{ steps.tag.outputs.version }}
      dir: ${{ steps.tag.outputs.dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Validate tag
        id: tag
        run: |
          PKG="${GITHUB_REF_NAME%-v*}"
          VERSION="${GITHUB_REF_NAME##*-v}"
          DIR=$(grep -lx "name = \"$PKG\"" integrations/*/pyproject.toml | xargs -r dirname)
          if [ -z "$DIR" ]; then
            echo "::error::No integration under integrations/ is named $PKG"
            exit 1
          fi
          PKG_VERSION=$(uv version --package "$PKG" --short)
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($VERSION) does not match $PKG version ($PKG_VERSION)"
            exit 1
          fi
          {
            echo "package=$PKG"
            echo "version=$VERSION"
            echo "dir=$DIR"
          } >> "$GITHUB_OUTPUT"

      - name: Build package
        run: uv build --package ${{ steps.tag.outputs.package }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: pypi
      url: https://pypi.org/project/${{ needs.build.outputs.package }}/
    permissions:
      id-token: write  # Required for trusted publishing
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build, publish-pypi]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Extract release notes
        env:
          VERSION: ${{ needs.build.outputs.version }}
          CHANGELOG: ${{ needs.build.outputs.dir }}/CHANGELOG.md
        run: |
          awk -v v="$VERSION" '/^## \[/ { p = index($0, "## [" v "]") == 1; next } p' "$CHANGELOG" > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "::error::$CHANGELOG has no section for $VERSION"
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: ${{ needs.build.outputs.package }} ${{ needs.build.outputs.version }}
          files: dist/*
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(needs.build.outputs.version, '-') }}
          make_latest: false  # "Latest release" stays the core release
