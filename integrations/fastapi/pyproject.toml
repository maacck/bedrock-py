[project]
name = "bedrock-fastapi"
version = "0.3.1"
description = "FastAPI integration for Bedrock: request DI scopes, request-bound database sessions, and BedrockExc responses."
readme = "README.md"
license = "MIT"
authors = [
    { name = "maacck", email = "c.mai@madainchina.com" }
]
keywords = ["bedrock", "fastapi", "starlette", "asgi", "middleware"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
requires-python = ">=3.12"
dependencies = [
    "anyio>=3.4.0",
    "bedrock-core>=0.3.1",
    "starlette>=0.40.0",
]

[project.urls]
Homepage = "https://bedrock-py.com"
Repository = "https://github.com/maacck/bedrock-py"
Documentation = "https://bedrock-py.com"
"Bug Tracker" = "https://github.com/maacck/bedrock-py/issues"

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
module-name = "bedrock_fastapi"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "fastapi>=0.115.0",
    "httpx2>=0.1.0",
    "aiosqlite>=0.20.0",
]
